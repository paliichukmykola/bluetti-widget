<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Bluetti AC200PL — стан</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f1c; color: #e2e8f0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 380px; padding: 28px 24px; }
  .label { color: #8b98b8; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
  .soc { font-size: 96px; font-weight: 800; line-height: 1; color: #fff; }
  .soc span { font-size: 44px; color: #94a3b8; font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: #1e293b; margin: 14px 0 18px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #22c55e; border-radius: 3px; }
  .grid { font-size: 28px; font-weight: 700; margin-bottom: 18px; }
  .grid.off { color: #f87171; }
  .grid.on { color: #4ade80; }
  .grid .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: currentColor; margin-right: 8px; vertical-align: 2px; }
  hr { border: none; border-top: 1px solid #1e293b; margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; font-size: 16px; padding: 5px 0; }
  .row .k { color: #94a3b8; }
  .row .v { color: #fff; font-weight: 600; }
  .warn { display: none; margin-top: 16px; background: rgba(234,179,8,.12); border: 1px solid rgba(234,179,8,.4); color: #facc15; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.4; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .foot .cd { color: #64748b; font-size: 13px; }
  .foot button { background: transparent; border: 1px solid #334155; color: #e2e8f0; border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  .foot button:hover { border-color: #64748b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label">Bluetti AC200PL</div>
  <div class="soc">100<span>%</span></div>
  <div class="bar"><i style="width: 100%"></i></div>
  <div class="grid on"><span class="dot"></span>Світло є</div>
  <hr>
  <div class="row"><span class="k">Навантаження</span><span class="v">0 Вт</span></div>
  
  <div class="row"><span class="k">Оновлено</span><span class="v">01:53</span></div>
  <div class="warn" id="warn"></div>
  <div class="foot"><span class="cd" id="cd"></span><button onclick="location.reload()">Оновити зараз</button></div>
</div>
<script>
  var updatedUtc = "2026-11-11T23:53:26+00:00";
  var RELOAD_S = 300;
  var STALE_MIN = 20;
  var left = RELOAD_S;
  function tick() {
    var m = Math.floor(left / 60), s = left % 60;
    document.getElementById("cd").textContent = "Оновлення за " + m + ":" + (s < 10 ? "0" : "") + s;
    if (left <= 0) { location.reload(); return; }
    left--;
    var ageMin = Math.floor((Date.now() - new Date(updatedUtc).getTime()) / 60000);
    var w = document.getElementById("warn");
    if (ageMin > STALE_MIN) {
      w.style.display = "block";
      w.textContent = "⚠ Дані застарілі — цьому знімку " + ageMin + " хв. Сторінка оновлюється автоматично.";
    } else { w.style.display = "none"; }
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
